<!DOCTYPE html>
<html>
<head>
  <title>Open Prompt Database</title>
  <link rel="stylesheet" href="sidepanel/styles.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="settings-page">
  <div class="settings-page-shell">
  <div class="settings-page-scroll">
  <header class="subpage-header">
    <a href="sidepanel/index.html" class="subpage-back" aria-label="Back to side panel" title="Back">
      <svg class="footer-md-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </a>
    <h2 class="subpage-title">Open Prompt Database</h2>
  </header>

  <section class="settings-section settings-section-first">
    <h3 class="settings-heading">Handle</h3>
    <p class="pm-subtitle" id="opd-handle-hint">Your public name on the catalog. Locked in after your first upload.</p>
    <div id="opd-handle-locked" class="opd-handle-card" hidden>
      <a id="opd-handle-profile-link" class="opd-handle-card-link" href="#" target="_blank" rel="noopener noreferrer">
        <span class="opd-handle-card-icon" aria-hidden="true">
          <svg class="footer-md-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </span>
        <span id="opd-handle-profile-text" class="opd-handle-card-text"></span>
        <svg class="footer-md-icon opd-handle-card-open" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
      </a>
    </div>
    <div id="opd-handle-edit-row" class="opd-handle-edit-row">
      <div class="opd-handle-input-row">
        <span class="opd-handle-prefix" aria-hidden="true">@</span>
        <input type="text" id="opd-handle-input" class="opd-handle-input opm-input-field" autocomplete="off" spellcheck="false" maxlength="32" placeholder="handle" />
        <button type="button" id="opd-handle-suggest" class="opd-handle-suggest" title="Suggest" aria-label="Suggest handle">
          <svg class="footer-md-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08a5.99 5.99 0 0 1-5.65 4c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
      </div>
      <button type="button" class="main opd-handle-confirm" id="opd-handle-confirm">Confirm</button>
    </div>
    <p id="opd-handle-status" class="pm-subtitle settings-status" aria-live="polite"></p>
  </section>

  <section class="settings-section">
    <h3 class="settings-heading">Publishing</h3>
    <p class="pm-subtitle">Share your prompts to the catalog when you are ready.</p>
    <label class="settings-toggle-row">
      <span>Publish prompts</span>
      <input type="checkbox" id="opd-publish-toggle" class="settings-toggle-input" />
      <span class="settings-toggle-switch" aria-hidden="true"></span>
    </label>
  </section>

  <section class="settings-section">
    <h3 class="settings-heading">Import</h3>
    <p class="pm-subtitle">Use <strong>Add to Open Prompt Manager</strong> on the website.</p>
    <button type="button" class="main" id="opd-catalog-access-btn">Enable catalog import</button>
    <p id="opd-catalog-enabled" class="opd-import-badge" hidden>
      <svg class="footer-md-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
      <span>Import enabled</span>
    </p>
    <p id="opd-catalog-access-status" class="pm-subtitle settings-status" aria-live="polite"></p>
    <a class="opd-browse-btn" id="opd-browse-catalog-link" href="https://openpromptdatabase.com/" target="_blank" rel="noopener noreferrer">
      <svg class="opd-browse-btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm0 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
      <span>Browse catalog</span>
    </a>
  </section>
  </div>
  </div>

  <script type="module" src="opd-settings.js"></script>
</body>
</html>
